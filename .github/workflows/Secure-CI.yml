name: Secure CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements.txt pytest
      - run: python -m pytest -v --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SBOM - CycloneDX
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements app/requirements.txt -o sbom.json

      - name: SAST - Semgrep
        if: always()
        run: |
          pip install semgrep
          semgrep scan --config auto --error --json -o semgrep.json app/

      - name: SCA - pip-audit
        if: always()
        run: |
          pip install pip-audit
          pip-audit -r app/requirements.txt -f json -o pip-audit.json

      - name: Secrets - Gitleaks
        if: always()
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            semgrep.json
            pip-audit.json
            sbom.json
